<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap');
  
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f5f5f5;
    --color-text-primary: #333333;
    --color-text-secondary: #777777;
    --color-border-secondary: #dddddd;
    --color-border-tertiary: #eeeeee;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body { background: #777777; margin: 0; padding: 12px; }

  .rt-wrap { font-family: 'Lato', sans-serif; color: var(--color-text-primary); max-width: 680px; margin: 0 auto; width: 100%; }

  .rt-header {
    background: #1a2e1a; border-radius: 16px; padding: 2.5rem 2rem 2rem;
    margin-bottom: 1.5rem; position: relative; overflow: hidden;
  }
  .rt-header::before { content:''; position:absolute; top:-30px; right:-30px; width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,0.04); }
  .rt-header::after { content:''; position:absolute; bottom:-50px; left:40px; width:250px; height:250px; border-radius:50%; background:rgba(255,255,255,0.03); }
  .rt-header-label { font-size:11px; font-weight:700; letter-spacing:3px; color:#a8c5a0; text-transform:uppercase; margin-bottom:0.5rem; }
  .rt-header-title { font-family:'Playfair Display',serif; font-size:36px; font-weight:700; color:#fff; margin:0 0 0.25rem; line-height:1.2; }
  .rt-header-sub { font-size:14px; color:#8db88d; font-weight:300; letter-spacing:0.5px; }
  .rt-header-tags { display:flex; gap:8px; margin-top:1.25rem; flex-wrap:wrap; }
  .rt-tag { background:rgba(255,255,255,0.1); color:#c8dfc8; font-size:11px; padding:4px 12px; border-radius:20px; font-weight:400; letter-spacing:0.5px; }

  .rt-day-card { background:var(--color-background-primary); border:0.5px solid var(--color-border-tertiary); border-radius:14px; margin-bottom:1rem; overflow:hidden; }
  .rt-day-header { display:flex; align-items:center; gap:14px; padding:1rem 1.25rem 0.85rem; border-bottom:0.5px solid var(--color-border-tertiary); cursor:pointer; user-select:none; }
  .rt-day-badge { width:44px; height:44px; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
  .rt-day-badge .day-num { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; line-height:1; }
  .rt-day-badge .day-abbr { font-size:9px; font-weight:700; letter-spacing:1px; text-transform:uppercase; margin-top:1px; }
  .rt-day-info { flex:1; }
  .rt-day-name { font-family:'Playfair Display',serif; font-size:16px; font-weight:600; margin:0 0 2px; }
  .rt-day-count { font-size:12px; color:var(--color-text-secondary); font-weight:300; }
  .rt-chevron { font-size:18px; color:var(--color-text-secondary); transition:transform 0.2s; display:inline-block; }
  .rt-chevron.open { transform:rotate(90deg); }

  .rt-events { padding:0.75rem 1.25rem 0.85rem; display:none; }
  .rt-events.open { display:block; }

  /* Each event row */
  .rt-event { display:flex; gap:12px; align-items:flex-start; }

  /* Connector between events */
  .rt-connector {
    display:flex; gap:12px; align-items:center;
    padding: 0 0;
  }

  .rt-time-col { min-width:52px; text-align:right; flex-shrink:0; }
  .rt-time { font-size:12px; font-weight:700; color:var(--color-text-secondary); letter-spacing:0.3px; }

  .rt-connector-time-col { min-width:52px; flex-shrink:0; }

  /* Dot + line column */
  .rt-dot-col { display:flex; flex-direction:column; align-items:center; flex-shrink:0; padding-top:3px; }
  .rt-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

  /* Connector vertical section */
  .rt-connector-dot-col {
    display:flex; flex-direction:column; align-items:center; flex-shrink:0;
    width:10px;
  }
  .rt-connector-line {
    width:1.5px; height:22px; background: var(--color-border-secondary);
  }
  .rt-connector-badge {
    font-size:9px; font-weight:700; letter-spacing:0.5px;
    color: var(--color-text-secondary);
    background: var(--color-background-secondary);
    border: 0.5px solid var(--color-border-tertiary);
    border-radius: 8px;
    padding: 2px 6px;
    white-space: nowrap;
    line-height:1.4;
  }
  .rt-connector-line-bottom {
    width:1.5px; height:22px; background: var(--color-border-secondary);
  }
  .rt-connector-mid {
    display:flex; align-items:center; gap:8px; flex:1; padding: 2px 0;
  }

  .rt-event-info { flex:1; padding-bottom: 4px; }
  .rt-event-name { font-size:13.5px; font-weight:400; margin:0 0 3px; color:var(--color-text-primary); line-height:1.35; }
  .rt-event-meta { display:flex; gap:6px; align-items:center; flex-wrap:wrap; margin-bottom:4px; }

  .pill-prime-qr { background:#e6f0ff; color:#1a4fa0; }
  .pill-reserved { background:#f0f9ef; color:#2a6a20; }
  .pill-free { background:#f5f0ff; color:#5a2da0; }

  }
  .rt-restaurant.locked .rt-rest-name {

  }
  .rt-restaurant.locked .rt-rest-hidden {

  }
  .rt-restaurant.unlocked .rt-rest-name {
    display: inline;
    color: #1a6a3a;

  }
  .rt-restaurant.unlocked .rt-rest-hidden {

  .rt-lock-bar {

    align-items: center;
    gap: 10px;
    background: #fffbe6;
    border: 0.5px solid #f0d060;

    padding: 3px 8px;
    font-size: 12px;

<script>
const SENHA = "20260726@bocaaberta";
let unlocked = false;

function tryUnlock() {
  const val = document.getElementById('lock-input').value;
  const err = document.getElementById('lock-err');
  if (val === SENHA) {
    unlocked = true;
    document.querySelectorAll('.rt-restaurant').forEach(el => {
      el.classList.remove('locked');
      el.classList.add('unlocked');
    });
    const bar = document.getElementById('lock-bar');
    bar.classList.add('open-state');
    document.getElementById('lock-icon').textContent = '🔓';
    document.getElementById('lock-msg').textContent = 'Restaurantes revelados!';
    document.getElementById('lock-input').style.display = 'none';
    document.querySelector('#lock-bar button').style.display = 'none';
    err.textContent = '';
  } else {
    err.textContent = 'senha incorreta';
    document.getElementById('lock-input').value = '';
  }
}

function wrapRestaurant(name) {
  return `<span class="rt-restaurant locked" onclick="hintUnlock(this)">` +
    `<span class="rt-rest-name">${name}</span>` +
    `<span class="rt-rest-hidden" title="clique para desbloquear">🔒 ••••••</span>` +
    `</span>`;
}

function hintUnlock(el) {
  if (!unlocked) {
    document.getElementById('lock-input').focus();

  "Carne e Osso", "Irlandês", "IL Piacere", "O Maquinista",

];

function protectEventName(name) {
  let result = name;
  RESTAURANTES.forEach(r => {
    if (result.includes(r)) {
      result = result.replace(r, wrapRestaurant(r));

  });
  return result;

function parseTime(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function formatInterval(mins) {
  if (mins < 60) return `${mins}min`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m === 0 ? `${h}h` : `${h}h${m}min`;
}

function buildSubitems(subs, evIdx, dayIdx) {
  if (!subs || subs.length === 0) return '';
  const uid = `sub-${dayIdx}-${evIdx}`;
  const items = subs.map(s => `<div class="rt-subitem">${s}</div>`).join('');
  return `
    <div class="rt-subitems">
      <div class="rt-subitem-toggle" onclick="toggleSub('${uid}', this)">
        <span class="sub-chevron">›</span> ${subs.length} pontos para visitar
      </div>
      <div class="rt-subitem-list" id="${uid}">${items}</div>
    </div>`;
}

const container = document.getElementById('days-container');

days.forEach((day, di) => {
  const card = document.createElement('div');
  card.className = `rt-day-card ${day.cls}`;

  const header = document.createElement('div');
  header.className = 'rt-day-header';
  header.innerHTML = `
    <div class="rt-day-badge">
      <span class="day-num">${day.n}</span>
      <span class="day-abbr">${day.abbr}</span>
    </div>
    <div class="rt-day-info">
      <div class="rt-day-name">${day.name}</div>
      <div class="rt-day-count">${day.events.length} atividades</div>
    </div>
    <span class="rt-chevron">›</span>`;

  const eventsDiv = document.createElement('div');
  eventsDiv.className = 'rt-events';

  day.events.forEach((ev, ei) => {
    const isLast = ei === day.events.length - 1;
    const pillsHtml = ev.pills.map(p => `<span class="rt-pill ${pillClasses[p]}">${pillLabels[p]}</span>`).join('');
    const subsHtml = buildSubitems(ev.subs, ei, di);

    // Event row
    const evRow = document.createElement('div');
    evRow.className = 'rt-event';
    evRow.innerHTML = `
      <div class="rt-time-col"><div class="rt-time">${ev.time}</div></div>
      <div class="rt-dot-col">
        <div class="rt-dot ${ev.dot}"></div>
      </div>
      <div class="rt-event-info">
        <div class="rt-event-name">${protectEventName(ev.name)}</div>
        ${pillsHtml ? `<div class="rt-event-meta">${pillsHtml}</div>` : ''}
        ${subsHtml}
      </div>`;
    eventsDiv.appendChild(evRow);

    // Connector between events
    if (!isLast) {
      const nextTime = parseTime(day.events[ei + 1].time);
      const curTime = parseTime(ev.time);
      const diff = nextTime - curTime;
      const label = diff > 0 ? formatInterval(diff) : '—';

      const conn = document.createElement('div');
      conn.className = 'rt-connector';
      conn.innerHTML = `
        <div class="rt-connector-time-col"></div>
        <div class="rt-connector-dot-col">
          <div class="rt-connector-line"></div>
          <div class="rt-connector-line"></div>
          <div class="rt-connector-line"></div>
        </div>
        <div class="rt-connector-mid">
          <span class="rt-connector-badge">⏱ ${label}</span>
        </div>`;
      eventsDiv.appendChild(conn);
    }
  });

  header.addEventListener('click', () => {
    const chevron = header.querySelector('.rt-chevron');
    const isOpen = eventsDiv.classList.contains('open');
    eventsDiv.classList.toggle('open', !isOpen);
    chevron.classList.toggle('open', !isOpen);
  });

  if (day.n === 1) {
    eventsDiv.classList.add('open');
    header.querySelector('.rt-chevron').classList.add('open');
  }

  card.appendChild(header);
  card.appendChild(eventsDiv);
  container.appendChild(card);
});

function toggleSub(uid, el) {
  const list = document.getElementById(uid);
  const chev = el.querySelector('.sub-chevron');
  const isOpen = list.classList.contains('open');
  list.classList.toggle('open', !isOpen);
  chev.classList.toggle('open', !isOpen);
}
</script>
